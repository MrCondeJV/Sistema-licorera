<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="bottleGrad9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="32" fill="url(#bgGrad9)" />

  <!-- Bottle Silhouette Graphic with Shadow -->
  <g filter="url(#shadow9)" transform="translate(60, 20)">
    <!-- Cap / Neck -->
    <rect x="52" y="10" width="16" height="12" rx="3" fill="#334155" />
    <path d="M 50 22 C 50 22, 44 48, 30 70 L 90 70 C 76 48, 70 22, 70 22 Z" fill="url(#bottleGrad9)" />
    <!-- Body -->
    <rect x="25" y="68" width="70" height="120" rx="14" fill="url(#bottleGrad9)" />
    <!-- Label -->
    <rect x="27" y="95" width="66" height="55" rx="6" fill="#9a3412" />
    <!-- Label text/emblem -->
    <text x="60" y="118" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle" fill="#ffffff">🥃</text>
    <text x="60" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#ffffff" letter-spacing="1">PREMIUM</text>
  </g>

  <!-- Bottom Brand Ribbon Banner -->
  <rect x="16" y="184" width="208" height="42" rx="14" fill="#0f172a" opacity="0.92" />
  <text x="120" y="202" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">RON MEDELLÍN</text>
  <text x="120" y="217" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle" fill="#94a3b8" letter-spacing="0.5">3 AÑOS 750ML</text>
</svg>